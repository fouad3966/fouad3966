<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="200" viewBox="0 0 1000 200" role="img" aria-label="Designili 3D Studio: Browser-native fashion engineering platform — generative AI textiles via FLUX.1 Schnell, real-time 3D garment simulation with PBR shading, Algerian Darja NLP for cultural motif extraction, and on-device virtual try-on via MediaPipe Pose WASM. Built with React 18, Three.js, Valtio and Node.js."><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1a0f2e"/><stop offset="1" stop-color="#0d0a1a"/></linearGradient>
<radialGradient id="gl" cx="0" cy="0" r="1"><stop offset="0" stop-color="#a78bfa" stop-opacity=".35"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></radialGradient>
<linearGradient id="sw" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".08"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1" fill="#2a1a4e"/></pattern>
<clipPath id="cl"><rect width="1000" height="200" rx="16"/></clipPath></defs>
<g clip-path="url(#cl)"><rect width="1000" height="200" fill="url(#bg)"/><rect width="1000" height="200" fill="url(#dots)" opacity=".7"/>
<ellipse cx="960" cy="200" rx="230" ry="130" fill="url(#gl)"><animate attributeName="rx" values="200;270;200" dur="5s" repeatCount="indefinite"/></ellipse>
<rect x="0" y="0" width="1000" height="3" fill="#a78bfa" opacity=".9"/>
<rect x="-200" y="0" width="200" height="200" fill="url(#sw)" transform="skewX(-20)"><animate attributeName="x" values="-200;1300" dur="6s" begin="0.0s" repeatCount="indefinite"/></rect></g>
<rect x=".75" y=".75" width="998.5" height="198.5" rx="15.5" fill="none" stroke="#a78bfa" stroke-opacity=".35" stroke-width="1.5"/>
<text x="34" y="40" font-family="'SF Mono','Fira Code',Consolas,'Liberation Mono',monospace" font-size="11.5" letter-spacing="2" fill="#a78bfa">AI &amp; 3D ENGINEERING  /  HACKATHON</text>
<text x="34" y="72" font-family="'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="26" font-weight="800" fill="#eaf1fb">Designili 3D Studio</text>
<circle cx="972" cy="27" r="4" fill="#a78bfa"><animate attributeName="opacity" values="1;.25;1" dur="2.4s" repeatCount="indefinite"/></circle><text x="34" y="100" font-family="'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="14" fill="#8aa0bd">Browser-native fashion engineering: generative AI textiles (FLUX.1 Schnell), real-time 3D PBR garment simulation,</text><text x="34" y="121" font-family="'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="14" fill="#8aa0bd">Algerian Darja NLP for cultural motif extraction, and on-device virtual try-on via MediaPipe Pose WASM.</text><text x="34" y="142" font-family="'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="14" fill="#8aa0bd">Six garment types, dynamic typography decals, and factory-ready tech pack export.</text><rect x="34" y="154" width="63" height="24" rx="12" fill="#a78bfa" fill-opacity=".12" stroke="#a78bfa" stroke-opacity=".5"/><text x="66" y="170" text-anchor="middle" font-family="'SF Mono','Fira Code',Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#eaf1fb">React</text><rect x="105" y="154" width="77" height="24" rx="12" fill="#a78bfa" fill-opacity=".12" stroke="#a78bfa" stroke-opacity=".5"/><text x="143" y="170" text-anchor="middle" font-family="'SF Mono','Fira Code',Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#eaf1fb">Three.js</text><rect x="190" y="154" width="70" height="24" rx="12" fill="#a78bfa" fill-opacity=".12" stroke="#a78bfa" stroke-opacity=".5"/><text x="225" y="170" text-anchor="middle" font-family="'SF Mono','Fira Code',Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#eaf1fb">FLUX.1</text><rect x="268" y="154" width="98" height="24" rx="12" fill="#a78bfa" fill-opacity=".12" stroke="#a78bfa" stroke-opacity=".5"/><text x="317" y="170" text-anchor="middle" font-family="'SF Mono','Fira Code',Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#eaf1fb">MediaPipe</text><rect x="374" y="154" width="70" height="24" rx="12" fill="#a78bfa" fill-opacity=".12" stroke="#a78bfa" stroke-opacity=".5"/><text x="409" y="170" text-anchor="middle" font-family="'SF Mono','Fira Code',Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#eaf1fb">Valtio</text><rect x="452" y="154" width="77" height="24" rx="12" fill="#a78bfa" fill-opacity=".12" stroke="#a78bfa" stroke-opacity=".5"/><text x="490" y="170" text-anchor="middle" font-family="'SF Mono','Fira Code',Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#eaf1fb">Node.js</text></svg>
