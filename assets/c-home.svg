<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="200" viewBox="0 0 1000 200" role="img" aria-label="Smart-Assistive-Home-System: A smart home that talks, sees without cameras and fetches things for you. Voice control through an n8n AI agent, a 3D digital twin for live monitoring, indoor localization, and an autonomous SLAM robot with a custom arm. Lead developer and system architect of a four-person team."><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#101f3b"/><stop offset="1" stop-color="#0a1428"/></linearGradient>
<radialGradient id="gl" cx="0" cy="0" r="1"><stop offset="0" stop-color="#34d399" stop-opacity=".35"/><stop offset="1" stop-color="#34d399" stop-opacity="0"/></radialGradient>
<linearGradient id="sw" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".08"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1" fill="#1b3257"/></pattern>
<clipPath id="cl"><rect width="1000" height="200" rx="16"/></clipPath></defs>
<g clip-path="url(#cl)"><rect width="1000" height="200" fill="url(#bg)"/><rect width="1000" height="200" fill="url(#dots)" opacity=".7"/>
<ellipse cx="960" cy="200" rx="230" ry="130" fill="url(#gl)"><animate attributeName="rx" values="200;270;200" dur="5s" repeatCount="indefinite"/></ellipse>
<rect x="0" y="0" width="1000" height="3" fill="#34d399" opacity=".9"/>
<rect x="-200" y="0" width="200" height="200" fill="url(#sw)" transform="skewX(-20)"><animate attributeName="x" values="-200;1300" dur="6s" begin="0.0s" repeatCount="indefinite"/></rect></g>
<rect x=".75" y=".75" width="998.5" height="198.5" rx="15.5" fill="none" stroke="#34d399" stroke-opacity=".35" stroke-width="1.5"/>
<text x="34" y="40" font-family="'SF Mono','Fira Code',Consolas,'Liberation Mono',monospace" font-size="11.5" letter-spacing="2" fill="#34d399">SYSTEMS &amp; IOT  /  FLAGSHIP</text>
<text x="34" y="72" font-family="'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="26" font-weight="800" fill="#eaf1fb">Smart-Assistive-Home-System</text>
<circle cx="972" cy="27" r="4" fill="#34d399"><animate attributeName="opacity" values="1;.25;1" dur="2.4s" repeatCount="indefinite"/></circle><text x="34" y="100" font-family="'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="14" fill="#8aa0bd">A smart home that talks, sees without cameras and fetches things for you. Voice control through an n8n AI agent,</text><text x="34" y="121" font-family="'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="14" fill="#8aa0bd">a 3D digital twin for live monitoring, indoor localization, and an autonomous SLAM robot with a custom arm. Lead</text><text x="34" y="142" font-family="'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="14" fill="#8aa0bd">developer and system architect of a four-person team.</text><rect x="34" y="154" width="42" height="24" rx="12" fill="#34d399" fill-opacity=".12" stroke="#34d399" stroke-opacity=".5"/><text x="55" y="170" text-anchor="middle" font-family="'SF Mono','Fira Code',Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#eaf1fb">n8n</text><rect x="84" y="154" width="63" height="24" rx="12" fill="#34d399" fill-opacity=".12" stroke="#34d399" stroke-opacity=".5"/><text x="115" y="170" text-anchor="middle" font-family="'SF Mono','Fira Code',Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#eaf1fb">NestJS</text><rect x="155" y="154" width="70" height="24" rx="12" fill="#34d399" fill-opacity=".12" stroke="#34d399" stroke-opacity=".5"/><text x="190" y="170" text-anchor="middle" font-family="'SF Mono','Fira Code',Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#eaf1fb">MongoDB</text><rect x="233" y="154" width="49" height="24" rx="12" fill="#34d399" fill-opacity=".12" stroke="#34d399" stroke-opacity=".5"/><text x="258" y="170" text-anchor="middle" font-family="'SF Mono','Fira Code',Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#eaf1fb">MQTT</text><rect x="290" y="154" width="70" height="24" rx="12" fill="#34d399" fill-opacity=".12" stroke="#34d399" stroke-opacity=".5"/><text x="325" y="170" text-anchor="middle" font-family="'SF Mono','Fira Code',Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#eaf1fb">Flutter</text><rect x="368" y="154" width="106" height="24" rx="12" fill="#34d399" fill-opacity=".12" stroke="#34d399" stroke-opacity=".5"/><text x="422" y="170" text-anchor="middle" font-family="'SF Mono','Fira Code',Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#eaf1fb">Raspberry Pi</text><rect x="483" y="154" width="63" height="24" rx="12" fill="#34d399" fill-opacity=".12" stroke="#34d399" stroke-opacity=".5"/><text x="514" y="170" text-anchor="middle" font-family="'SF Mono','Fira Code',Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#eaf1fb">OpenCV</text><rect x="554" y="154" width="49" height="24" rx="12" fill="#34d399" fill-opacity=".12" stroke="#34d399" stroke-opacity=".5"/><text x="578" y="170" text-anchor="middle" font-family="'SF Mono','Fira Code',Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#eaf1fb">SLAM</text></svg>