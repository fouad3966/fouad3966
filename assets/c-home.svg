<text x="30" y="80" font-family="'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="13.5" fill="#8aa0bd">A smart home that talks, sees without cameras and fetches things for you. Voice control through an</text><text x="30" y="100" font-family="'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="13.5" fill="#8aa0bd">n8n AI agent, a 3D digital twin for live monitoring, indoor localization, and an autonomous SLAM</text><text x="30" y="120" font-family="'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="13.5" fill="#8aa0bd">robot with a custom arm. Lead developer and system architect of a four-person team.</text><rect x="30" y="138" width="39" height="22" rx="11" fill="#34d399" fill-opacity=".12" stroke="#34d399" stroke-opacity=".5"/><text x="50" y="153" text-anchor="middle" font-family="'SF Mono','Fira Code',Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#e6edf7">n8n</text><rect x="77" y="138" width="61" height="22" rx="11" fill="#34d399" fill-opacity=".12" stroke="#34d399" stroke-opacity=".5"/><text x="108" y="153" text-anchor="middle" font-family="'SF Mono','Fira Code',Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#e6edf7">NestJS</text><rect x="146" y="138" width="68" height="22" rx="11" fill="#34d399" fill-opacity=".12" stroke="#34d399" stroke-opacity=".5"/><text x="180" y="153" text-anchor="middle" font-family="'SF Mono','Fira Code',Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#e6edf7">MongoDB</text><rect x="222" y="138" width="46" height="22" rx="11" fill="#34d399" fill-opacity=".12" stroke="#34d399" stroke-opacity=".5"/><text x="245" y="153" text-anchor="middle" font-family="'SF Mono','Fira Code',Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#e6edf7">MQTT</text><rect x="276" y="138" width="68" height="22" rx="11" fill="#34d399" fill-opacity=".12" stroke="#34d399" stroke-opacity=".5"/><text x="310" y="153" text-anchor="middle" font-family="'SF Mono','Fira Code',Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#e6edf7">Flutter</text><rect x="352" y="138" width="103" height="22" rx="11" fill="#34d399" fill-opacity=".12" stroke="#34d399" stroke-opacity=".5"/><text x="403" y="153" text-anchor="middle" font-family="'SF Mono','Fira Code',Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#e6edf7">Raspberry Pi</text><rect x="463" y="138" width="61" height="22" rx="11" fill="#34d399" fill-opacity=".12" stroke="#34d399" stroke-opacity=".5"/><text x="493" y="153" text-anchor="middle" font-family="'SF Mono','Fira Code',Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#e6edf7">OpenCV</text><rect x="531" y="138" width="46" height="22" rx="11" fill="#34d399" fill-opacity=".12" stroke="#34d399" stroke-opacity=".5"/><text x="555" y="153" text-anchor="middle" font-family="'SF Mono','Fira Code',Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#e6edf7">SLAM</text></svg>